<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sales Tax Nexus Tracker{% endblock %}</title>
  <style>
    :root {
      --ink: #1a2027;
      --muted: #5b6774;
      --line: #e2e6ea;
      --bg: #f6f8fa;
      --card: #ffffff;
      --accent: #1f6feb;
      --accent-ink: #ffffff;
      --soft: #eef2f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
    }
    header.site {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
    header.site a.brand { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1.15rem; }
    header.site .tagline { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
    main { padding: 28px 0 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    h2 { font-size: 1.15rem; margin: 32px 0 12px; }
    p.lead { color: var(--muted); margin-top: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    a.client-row {
      display: flex; justify-content: space-between; align-items: center;
      text-decoration: none; color: var(--ink);
    }
    a.client-row .count { color: var(--muted); font-size: 0.9rem; }
    .stack > * + * { margin-top: 10px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type=text], input[type=password], select {
      width: 100%; padding: 11px 12px; font-size: 1rem;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    input[type=file] { font-size: 0.95rem; }
    table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .scroll { overflow-x: auto; }
    .field { margin-bottom: 16px; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .checkbox { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; }
    .checkbox input { margin-top: 4px; }
    button, .btn {
      display: inline-block; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--accent); color: var(--accent-ink);
      font-size: 1rem; font-weight: 600; padding: 11px 18px; margin-top: 14px;
      text-decoration: none;
    }
    button:hover, .btn:hover { filter: brightness(0.95); }
    .btn.secondary { background: var(--soft); color: var(--ink); }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); padding: 8px 0; }
    .error {
      background: #fff4f2; border: 1px solid #f3c9c0; color: #8a2b1e;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
    }
    .soon {
      display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em;
      text-transform: uppercase; color: var(--muted); background: var(--soft);
      border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: middle;
    }
    .action { opacity: 0.65; }
    .card.flag { border-left: 4px solid #d9822b; }
    .tag {
      display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em;
      text-transform: uppercase; border-radius: 999px; padding: 2px 9px; vertical-align: middle;
    }
    .tag.review { color: #8a4b12; background: #fbe6d3; }
    .statehead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .statehead .pct { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
    .bar { height: 7px; background: var(--soft); border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .dims { margin: 8px 0 2px; }
    .dims > div { margin: 2px 0; }
    .note {
      background: #eef4fb; border: 1px solid #cfe0f3; color: #244b73;
      padding: 12px 14px; border-radius: 8px; margin-bottom: 16px;
    }
    .backlink { color: var(--accent); text-decoration: none; font-size: 0.95rem; }
    footer.site { color: var(--muted); font-size: 0.82rem; padding: 8px 0 40px; }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="{{ url_for('home') }}">Sales Tax Nexus Tracker</a>
      <div class="tagline">Shows how much each client has sold into each state. It flags exposure for you to review; it does not decide nexus.</div>
    </div>
  </header>
  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer class="site">
    <div class="wrap">Internal tool for Priceless CPA. Exposure figures are for review by a person at the firm.</div>
  </footer>
</body>
</html>
